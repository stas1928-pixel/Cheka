<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#121212">
<title>Opening Trainer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ HOME SCREEN ============
     The two openings pinned at the top (training is one tap away),
     progress and settings below on scroll. -->
<main data-screen="home">
  <header class="home-header">
    <h1>Opening Trainer</h1>
  </header>

  <section id="opening-cards" class="cards" aria-label="Openings"></section>
</main>

<!-- ============ TRAINER SCREEN ============
     Board is the hero; everything else stays minimal. -->
<main data-screen="trainer" hidden>
  <header class="trainer-header">
    <button id="back" class="icon-btn" aria-label="Back to home">‹</button>
    <div class="trainer-title">
      <span id="trainer-name"></span>
      <span id="trainer-side" class="pill"></span>
    </div>
  </header>

  <div id="board" class="board" role="grid" aria-label="Chess board"></div>
  <div id="status" class="status neutral" role="status">Loading…</div>
  <div id="moves" class="moves"></div>
  <div id="branch-note" class="note" hidden></div>

  <div class="controls">
    <button id="restart">Restart line</button>
  </div>
</main>

<!-- type="module" lets app.js import the other files and the vendored chess.js -->
<script type="module" src="js/app.js"></script>
</body>
</html>
